# 47.108.186.217（rustfs）nginx 的 /assets 直出片段。
#
# 安装位置：/www/server/panel/vhost/nginx/47.108.186.217.conf 的 server 块内。
# 目录来源：deploy/platform/publish-web-assets.sh 把 admin-web 和 psou-web 的
# assets 合并发布到 /www/wwwroot/47.108.186.217/assets。
#
# 两个站点共用这一个资源命名空间，所以构建产物必须保留 content hash 文件名；
# 发布脚本会做跨站点 sha256 交叉校验，发现同名不同内容会直接报错。
location ^~ /assets/ {
    root /www/wwwroot/47.108.186.217;
    try_files $uri =404;
    gzip_static on;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
    if ($request_method = OPTIONS) {
        return 204;
    }
}
